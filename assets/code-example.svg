<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img" aria-label="Code example: hasPromptInjection and scan with source external">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1b1140"/></linearGradient></defs>
  <rect width="1280" height="350" rx="24" fill="url(#bg)"/>
  <rect x="40" y="30" width="1200" height="290" rx="16" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="68" cy="56" r="7" fill="#f87171"/><circle cx="92" cy="56" r="7" fill="#fbbf24"/><circle cx="116" cy="56" r="7" fill="#34d399"/>
  <text x="640" y="61" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#94a3b8">example.js</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20">
    <text x="72" y="118" xml:space="preserve"><tspan fill="#c084fc">const </tspan><tspan fill="#e0e7ff">pi </tspan><tspan fill="#f9a8d4">= </tspan><tspan fill="#67e8f9">require</tspan><tspan fill="#e0e7ff">(</tspan><tspan fill="#86efac">'prompt-injections'</tspan><tspan fill="#e0e7ff">);</tspan></text>
    <text x="72" y="178" xml:space="preserve"><tspan fill="#e0e7ff">pi</tspan><tspan fill="#f9a8d4">.</tspan><tspan fill="#67e8f9">hasPromptInjection</tspan><tspan fill="#e0e7ff">(</tspan><tspan fill="#86efac">'Ignore all previous instructions…'</tspan><tspan fill="#e0e7ff">);</tspan><tspan fill="#64748b">  // </tspan><tspan fill="#fbbf24">true</tspan></text>
    <text x="72" y="208" xml:space="preserve"><tspan fill="#e0e7ff">pi</tspan><tspan fill="#f9a8d4">.</tspan><tspan fill="#67e8f9">hasPromptInjection</tspan><tspan fill="#e0e7ff">(</tspan><tspan fill="#86efac">'What is the capital of France?'</tspan><tspan fill="#e0e7ff">);</tspan><tspan fill="#64748b">     // </tspan><tspan fill="#fbbf24">false</tspan></text>
    <text x="72" y="268" xml:space="preserve"><tspan fill="#c084fc">const </tspan><tspan fill="#e0e7ff">res </tspan><tspan fill="#f9a8d4">= </tspan><tspan fill="#e0e7ff">pi</tspan><tspan fill="#f9a8d4">.</tspan><tspan fill="#67e8f9">scan</tspan><tspan fill="#e0e7ff">(</tspan><tspan fill="#e0e7ff">toolDescription</tspan><tspan fill="#e0e7ff">, { </tspan><tspan fill="#e0e7ff">source</tspan><tspan fill="#f9a8d4">: </tspan><tspan fill="#86efac">'external'</tspan><tspan fill="#e0e7ff"> });</tspan></text>
    <text x="72" y="298" xml:space="preserve"><tspan fill="#64748b">// </tspan><tspan fill="#64748b">{ safe: false, threats: [ { type: 'tool-poisoning', severity: 'high' } ] }</tspan></text>
  </g>
</svg>
